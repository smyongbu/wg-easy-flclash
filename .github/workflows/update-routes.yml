name: 更新国内路由表

on:
  schedule:
    - cron: '23 19 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 生成最新路由表
        run: node scripts/generate-cn-direct-routes.mjs

      - name: 校验路由表
        run: node scripts/validate-routes.mjs

      - name: 提交变化
        shell: bash
        run: |
          if git diff --quiet -- data/cn-direct-allowedips.txt; then
            echo '路由表没有变化。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cn-direct-allowedips.txt
          git commit -m '更新国内 IPv4 路由表'
          git push
