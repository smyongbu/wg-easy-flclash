services:
  wg-easy:
    build:
      context: .
      args:
        WG_EASY_VERSION: ${WG_EASY_VERSION:-15.3.0}
    image: ${WG_EASY_IMAGE:-wg-easy-cn-direct:15.3.0}
    container_name: wg-easy
    environment:
      - PORT=51821
      - HOST=0.0.0.0
      - INIT_ENABLED=false
      - INSECURE=true
      - DISABLE_IPV6=true
      - CN_DIRECT_EXTRA_CIDRS=${CN_DIRECT_EXTRA_CIDRS-192.168.1.0/24,10.0.8.0/24}
    volumes:
      - ./runtime:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - '${WG_PORT:-51820}:51820/udp'
      - '${WG_UI_BIND:-0.0.0.0}:${WG_UI_PORT:-51821}:51821/tcp'
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
